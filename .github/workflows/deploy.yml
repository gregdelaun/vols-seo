name: Build & deploy site SEO vols

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC chaque jour : prix frais tôt le matin
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # pour committer le cache data/ (prix + blurbs)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Collecte prix + routes (Ryanair)
        env:
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: node gen/catalog.mjs

      - name: Snapshot historique des prix
        run: node gen/history.mjs

      - name: Contenu éditorial (Gemini, caché)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node gen/blurbs.mjs

      - name: Photos destinations (Pixabay, cache URLs)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node gen/photos.mjs

      - name: Traduction NL (Gemini, caché)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node gen/translate.mjs

      - name: Génère le site
        env:
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_GA_ID: ${{ vars.SITE_GA_ID }}
          SITE_TELEGRAM: ${{ vars.SITE_TELEGRAM }}
          SITE_TIKTOK: ${{ vars.SITE_TIKTOK }}
          SITE_YOUTUBE: ${{ vars.SITE_YOUTUBE }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node gen/build.mjs

      - name: Post Telegram (digest bons plans)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: node gen/telegram.mjs

      - name: Alertes baisse de prix (Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: node gen/alerts.mjs || echo "alertes ignorées"

      - name: Commit du cache (prix + blurbs)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ || true
          git commit -m "chore: maj cache prix/blurbs [skip ci]" || echo "rien à committer"
          git push || echo "push ignoré"

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping moteurs (IndexNow + sitemap)
        if: ${{ vars.SITE_BASE_URL != '' }}
        run: |
          BASE="${{ vars.SITE_BASE_URL }}"
          KEY="${{ secrets.INDEXNOW_KEY }}"
          # IndexNow (Bing, Yandex...) : resoumet la home -> recrawl du sitemap
          if [ -n "$KEY" ]; then
            curl -s "https://api.indexnow.org/indexnow?url=${BASE}/&key=${KEY}&keyLocation=${BASE}/${KEY}.txt" || true
          fi
          # notifie Bing du sitemap
          curl -s "https://www.bing.com/ping?sitemap=${BASE}/sitemap.xml" || true
          echo "ping envoyé"
